[package]
name = "clipboard-m0"
version = "0.1.0"
edition = "2021"

[lib]
name = "clipboard_m0"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Security"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 1
opt-level = 1

# 依赖首次编译更慢；避免加解密、哈希和图片处理在开发构建中退化。
[profile.dev.package."*"]
opt-level = 3
