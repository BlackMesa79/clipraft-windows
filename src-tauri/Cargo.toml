[package]
name = "clipraft-windows"
version = "0.8.0"
license = "MIT"
edition = "2021"

[lib]
name = "clipraft_windows"
crate-type = ["lib"]

# 可执行文件使用产品名。
[[bin]]
name = "clipraft"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "UI_Composition", "UI_Composition_Desktop", "System", "Win32_Security"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
zstd = { version = "0.13", default-features = false }
pinyin = "0.10"
# 复用锁文件中已有的 HTML5 解析器与编码库，预览只输出安全块。
dom_query = "=0.28.0"
base64 = "=0.23.1"
window-vibrancy = "=0.8.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 1
opt-level = 1

# 依赖首次编译更慢；避免加解密、哈希和图片处理在开发构建中退化。
[profile.dev.package."*"]
opt-level = 3
