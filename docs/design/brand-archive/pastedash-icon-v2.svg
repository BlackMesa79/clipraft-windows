<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 方案二：速度箭头 + 文档 - 更简洁现代 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B9FED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B7DD6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="20" y="20" width="216" height="216" rx="48" fill="url(#bgGrad)"/>

  <!-- 三张文档卡片（轻微偏移，营造速度感） -->
  <g opacity="0.4">
    <rect x="45" y="90" width="120" height="90" rx="6" fill="#FFFFFF"/>
  </g>
  <g opacity="0.6">
    <rect x="55" y="85" width="120" height="90" rx="6" fill="#FFFFFF"/>
  </g>
  <rect x="65" y="80" width="120" height="90" rx="6" fill="#FFFFFF"/>

  <!-- 文档内简单线条 -->
  <line x1="80" y1="100" x2="160" y2="100" stroke="#3B7DD6" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="115" x2="145" y2="115" stroke="#5B9FED" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="130" x2="155" y2="130" stroke="#5B9FED" stroke-width="3" stroke-linecap="round"/>

  <!-- 快速箭头（从左下到右上，穿过文档） -->
  <path d="M 40 180 L 200 70 M 180 62 L 200 70 L 192 90"
        stroke="url(#arrowGrad)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- 速度线 -->
  <line x1="30" y1="170" x2="70" y2="140" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="40" y1="185" x2="75" y2="160" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
</svg>
