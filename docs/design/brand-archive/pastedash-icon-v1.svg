<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 方案一：闪电剪贴板 - 叠层文档 + 闪电符号 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="20" y="20" width="216" height="216" rx="48" fill="url(#grad1)"/>

  <!-- 三层堆叠的文档卡片（体现历史记录） -->
  <rect x="60" y="100" width="136" height="96" rx="8" fill="#FFFFFF" opacity="0.3"/>
  <rect x="60" y="90" width="136" height="96" rx="8" fill="#FFFFFF" opacity="0.5"/>
  <rect x="60" y="80" width="136" height="96" rx="8" fill="#FFFFFF" opacity="1"/>

  <!-- 文档内容线条 -->
  <line x1="80" y1="100" x2="176" y2="100" stroke="#357ABD" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="116" x2="156" y2="116" stroke="#357ABD" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="80" y1="132" x2="166" y2="132" stroke="#357ABD" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- 闪电符号（快速的象征） -->
  <path d="M 150 50 L 120 110 L 145 110 L 115 170 L 165 100 L 140 100 Z"
        fill="url(#grad2)"
        stroke="#FF8C00"
        stroke-width="3"
        stroke-linejoin="round"/>
</svg>
