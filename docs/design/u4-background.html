<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>片筏 · 快速滚轮背景方案</title>
  <link rel="stylesheet" href="u4-background.css" />
</head>
<body data-theme="light" data-scene="editor">
  <main class="review">
    <header class="review-heading">
      <div><span class="eyebrow">CLIPRAFT / U4 · 局部背景探索</span><h1>让滚轮从背景里浮出来</h1>
      <p>卡片、间距和右上角计数保持当前版本，只比较滚轮背后的局部衬底。</p></div>
      <span class="draft-label">独立设计稿 · 不修改产品</span>
    </header>
    <section class="review-controls" aria-label="设计稿控制">
      <label>面板主题 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label>后方场景 <select id="scene"><option value="editor">复杂代码窗口</option><option value="document">明亮文档窗口</option><option value="wallpaper">彩色桌面壁纸</option></select></label>
      <label class="baseline"><input id="baseline" type="checkbox" /> 对照原版无背景</label>
      <div class="navigation"><button id="previous" type="button">↑ 上一条</button><button id="next" type="button">↓ 下一条</button></div>
    </section>
    <div class="proposal-grid" id="proposals"></div>
    <footer class="review-note">背景仅覆盖快速面板的局部范围。按钮和后方桌面是评审道具；雾面效果为网页材质模拟，不代表已实现跨窗口模糊。</footer>
  </main>
  <script type="module">
    const proposals = [
      { id: 'a', name: '柔边暗幕', tag: '最轻的介入', description: '用边缘渐隐的中性暗底压住杂乱背景，没有明显容器边界。', tradeoff: '空间感自然；明亮窗口上更显眼。' },
      { id: 'b', name: '雾面托盘', tag: '优先推荐', description: '圆角半透明衬底，把整组卡片聚成一个浮层，同时保留桌面环境感。', tradeoff: '辨识与轻盈较均衡；模糊材质需原生评估。' },
      { id: 'c', name: '中心光幕', tag: '强调选中', description: '中心最强、上下渐隐的青灰光幕，让选中项像位于转盘的最前端。', tradeoff: '轮盘感较强；最远卡片的隔离感较弱。' },
      { id: 'd', name: '实色浮层', tag: '辨识优先', description: '低对比实色底板，完整隔离后方内容，以内阴影保留一点舞台深度。', tradeoff: '文字最稳定；窗口存在感也最明显。' },
    ];
    const samples = [
      { title: 'https://design.example.com/review', detail: '链接', icon: '↗' },
      { title: '界面调整记录与验收清单', detail: '文本', icon: 'T' },
      { title: '把想法收进片筏，随时接着用。', detail: '文本', icon: 'T' },
      { title: '山间的一点绿', detail: '图片', icon: 'image' },
      { title: '项目说明.pdf', detail: '文件', icon: '▤' },
      { title: '修订后的配色与间距', detail: '文本', icon: 'T' },
      { title: '今天的灵感，留给明天的自己。', detail: '文本', icon: 'T' },
    ];
    let position = 3;
    const desktop = `<div class="desktop" aria-hidden="true"><div class="desktop-toolbar"><i></i><i></i><i></i><span class="scene-title">工作区 / 设计笔记</span></div><div class="desktop-content"><aside>项目文件<br/><br/>概览<br/>设计草稿<br/>组件与样式<br/>开发记录<br/>参考资料<br/><br/>最近修改<br/>快速滚轮<br/>界面方案</aside><div class="desktop-lines">${Array.from({length:18},(_,i)=>`<div><em>${String(i+1).padStart(2,'0')}</em><span>${['const selected = history.current();','background: palette.surface;','const position = session.position;','保存灵感，保持流畅。','function updateSelection() {','  renderCards(neighborhood);','} // 当前窗口的工作内容'][i%7]}</span></div>`).join('')}</div></div></div>`;
    document.getElementById('proposals').innerHTML = proposals.map(proposal => `
      <article class="proposal" data-proposal="${proposal.id}">
        <header class="proposal-heading"><div><span class="proposal-letter">${proposal.id.toUpperCase()}</span><h2>${proposal.name}</h2></div><span class="proposal-tag">${proposal.tag}</span></header>
        <div class="canvas">${desktop}<div class="wheel-frame"><div class="wheel-backdrop ${proposal.id}"></div><span class="count"></span><div class="wheel-cards"></div></div></div>
        <div class="proposal-description"><p>${proposal.description}</p><small>${proposal.tradeoff}</small></div>
      </article>`).join('');
    function renderCards() {
      document.querySelectorAll('.wheel-cards').forEach(wheel => {
        wheel.innerHTML = Array.from({length:5},(_,index) => {
          const distance = index - 2;
          const depth = Math.abs(distance);
          const sample = samples[(position + distance + samples.length) % samples.length];
          const transform = `translateY(${distance * 76}px) translateZ(${-Math.min(depth,3)*40}px) rotateX(${-distance*18}deg) scale(${1-depth*.06})`;
          const icon = sample.icon === 'image' ? '<span class="sample-image"></span>' : `<span class="type-icon">${sample.icon}</span>`;
          return `<div class="wheel-card ${distance===0?'selected':''}" data-distance="${distance}" style="transform:${transform};z-index:${20-depth}"><span class="index">${(position+distance+301)%301+1}</span>${icon}<div class="card-content"><span class="summary">${sample.title}</span></div></div>`;
        }).join('');
      });
      document.querySelectorAll('.count').forEach(counter => {counter.textContent = `${position+1} / 301 条`;});
    }
    document.getElementById('theme').addEventListener('change', event => { document.body.dataset.theme = event.target.value; });
    document.getElementById('scene').addEventListener('change', event => { document.body.dataset.scene = event.target.value; });
    document.getElementById('baseline').addEventListener('change', event => { document.body.classList.toggle('without-background',event.target.checked); });
    document.getElementById('previous').addEventListener('click', () => {position=(position+300)%301;renderCards();});
    document.getElementById('next').addEventListener('click', () => {position=(position+1)%301;renderCards();});
    function fitWheels() {
      document.querySelectorAll('.canvas').forEach(canvas => {
        canvas.style.setProperty('--wheel-scale',Math.min(1,(canvas.clientWidth-24)/420));
      });
    }
    const observer = new ResizeObserver(fitWheels);
    document.querySelectorAll('.canvas').forEach(canvas => observer.observe(canvas));
    renderCards();
    fitWheels();
  </script>
</body>
</html>
